# cliff.toml - git-cliff 設定ファイル (Debian x 絵文字ハイブリッドスタイル)

[changelog]
# チェンジログ全体のヘッダー
header = """
# 📖 変更履歴 (CHANGELOG)

Hello Reader プロジェクトの全変更履歴だにょろ！
"""
# 各バージョンのテンプレート
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased] - 未リリース
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**破壊的変更**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))
{% endfor %}
{% endfor %}
"""
# フッター
footer = """
<!-- generated by git-cliff -->
"""
# コミットメッセージのトリミング
trim = true

[git]
# 従来型の Conventional Commits パースルール
conventional_commits = true
# 判定順序の設定
filter_unconventional = false
split_commits = false

# グループ（カテゴリ）マッピングと絵文字
commit_parsers = [
  { message = "^feat", group = "🚀 新機能 (Features)" },
  { message = "^fix", group = "🐛 バグ修正 (Bug Fixes)" },
  { message = "^doc", group = "📝 ドキュメント (Documentation)" },
  { message = "^perf", group = "⚡️ パフォーマンス改善 (Performance)" },
  { message = "^refactor", group = "♻️ リファクタリング (Refactoring)" },
  { message = "^style", group = "🎨 コードスタイル (Style)" },
  { message = "^test", group = "🧪 テスト (Tests)" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "📦 依存関係の更新 (Dependencies)" },
  { message = "^chore", group = "⚙️ その他・メンテナンス (Maintenance)" },
  { message = ".*", group = "💡 その他の変更 (Other Changes)" },
]

# 無視するタグやコミット
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
date_order = false
sort_commits = "oldest"
