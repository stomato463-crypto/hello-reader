# cliff.toml - git-cliff 設定ファイル (Hello Reader 0.YY.MM.PATCH 規約対応)

[changelog]
# チェンジログ全体のヘッダー
header = """
# 📖 変更履歴 (CHANGELOG)

This is the complete change log for the Hello Reader project.
This project uses the `0.YY.MM.PATCH` versioning scheme (e.g. 0.26.10.0).
This is a long text, so please be careful if you are using a screen reader.

日本語:
Hello Reader プロジェクトの全変更履歴です。
本プロジェクトは `0.西暦下2桁.月.パッチ` 規約 (例: 0.26.10.0) を使用しています。
長文ですので、スクリーンリーダーをご利用の方は注意してください。
"""
# 各バージョンのテンプレート
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased] - 未リリース
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**破壊的変更**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))
{% endfor %}
{% endfor %}
"""
# フッター
footer = """
<!-- generated by git-cliff for Hello Reader -->
"""
# コミットメッセージのトリミング
trim = true

[git]
# 従来型の Conventional Commits パースルール
conventional_commits = true
filter_unconventional = false
split_commits = false

# グループ（カテゴリ）マッピングと絵文字
commit_parsers = [
  { message = "^feat", group = "🚀 新機能 (Features)" },
  { message = "^fix", group = "🐛 バグ修正 (Bug Fixes)" },
  { message = "^doc", group = "📝 ドキュメント (Documentation)" },
  { message = "^perf", group = "⚡️ パフォーマンス改善 (Performance)" },
  { message = "^refactor", group = "♻️ リファクタリング (Refactoring)" },
  { message = "^style", group = "🎨 コードスタイル (Style)" },
  { message = "^test", group = "🧪 テスト (Tests)" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "📦 依存関係の更新 (Dependencies)" },
  { message = "^chore", group = "⚙️ その他・メンテナンス (Maintenance)" },
  { message = ".*", group = "💡 その他の変更 (Other Changes)" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v0\\.[0-9]*"
sort_commits = "oldest"

