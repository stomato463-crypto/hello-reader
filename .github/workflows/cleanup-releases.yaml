name: Auto Cleanup Old Releases

on:
  schedule:
    # 毎日 午前9時(JST) / 00:00(UTC) に自動でお掃除を実行！
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動で「今すぐお掃除実行」ボタンを押すことも可能！

permissions:
  contents: write

jobs:
  cleanup-old-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Releases Older Than 31 Days
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3              # どんなに古くても最新の3件は念のため残す（安心安全！）
          delete_tags: true           # リリースに関連するタグも一緒にお掃除
          older_than: 31d             # 31日以上経過したものを削除
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
