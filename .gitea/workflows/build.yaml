name: Hello Reader CI Build

on:
  push:
    branches:
      - main
      - master
      - alpha
      - 'dev-*'
      - '*'
  pull_request:

jobs:
  build:
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Debug APK (Windows Host)
        run: .\gradlew.bat assembleDebug
        shell: powershell
