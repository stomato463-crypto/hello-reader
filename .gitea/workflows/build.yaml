name: Hello Reader CI Build & Release

on:
  push:
    branches:
      - master
      - main
      - github-main
      - 'dev-*'

jobs:
  # 1. スパルタビルド＆チェック（全ブランチで実行）
  build-and-test:
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure local.properties exists (Anonymous SDK path)
        run: |
          if (-not (Test-Path "local.properties")) {
              $sdkPath = $env:ANDROID_HOME
              if (-not $sdkPath) { $sdkPath = "$env:LOCALAPPDATA\Android\Sdk" }
              $escapedPath = $sdkPath -replace '\\', '\\'
              "sdk.dir=$escapedPath" | Out-File -FilePath "local.properties" -Encoding utf8
          }
        shell: powershell

      - name: Build Debug APK Verification (Sparta Check)
        run: .\gradlew.bat clean assembleDebug
        shell: powershell

      - name: Rename and Copy APK according to AGENTS.md policy
        run: |
          $shortHash = (git rev-parse --short=8 HEAD).Trim()
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $apkName = "debug-" + $shortHash + "-" + $timestamp + ".apk"
          $outputDir = "app/build/outputs/apk/debug"
          $sourceApk = Join-Path $outputDir "app-debug.apk"
          $targetApk = Join-Path $outputDir $apkName
          
          if (Test-Path $sourceApk) {
              Copy-Item $sourceApk -Destination $targetApk -Force
              Write-Host "Renamed APK to: $apkName" -ForegroundColor Green
              
              # Copy to Desktop/hello-reader as specified in AGENTS.md
              $desktopDir = Join-Path $env:USERPROFILE "Desktop\hello-reader"
              if (-not (Test-Path $desktopDir)) {
                  New-Item -ItemType Directory -Path $desktopDir -Force | Out-Null
              }
              Copy-Item $targetApk -Destination (Join-Path $desktopDir $apkName) -Force
              Write-Host "Copied APK to Desktop: $desktopDir" -ForegroundColor Green
              
              # Save dynamic name for artifact step
              "TARGET_APK_NAME=$apkName" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
        shell: powershell

      - name: Upload Verified APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/debug-*.apk

  # 2. github-main ブランチへのプッシュ時のみ、GitHub.com の main ブランチへ自動転送（Push）！
  sync-to-github:
    needs: build-and-test
    if: github.ref == 'refs/heads/github-main'
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Verified APK Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug

      - name: Push to GitHub.com main branch and Create GitHub Release
        run: |
          $env:GIT_SSH_COMMAND = "ssh -o StrictHostKeyChecking=no"
          if (git remote | Select-String -Pattern "^github$") {
              git remote set-url github git@github.com:stomato463-crypto/hello-reader.git
          } else {
              git remote add github git@github.com:stomato463-crypto/hello-reader.git
          }
          # 1. GitHub.com の main ブランチへコードをプッシュ
          git push -f github github-main:main

          # 2. 自動タグの生成 (例: v0.0.1-alpha-20260907-44373b7)
          $shortHash = (git rev-parse --short=8 HEAD).Trim()
          $dateStr = Get-Date -Format "yyyyMMdd"
          $tagName = "v0.0.1-alpha-" + $dateStr + "-" + $shortHash
          
          Write-Host "Creating and Pushing Tag: $tagName" -ForegroundColor Green
          git tag -f $tagName
          git push -f github $tagName

          # 3. GitHub CLI (gh) を使って、GitHub Release と自動リリースノートを生成！
          if (Get-Command gh -ErrorAction SilentlyContinue) {
              $apkFile = Get-ChildItem "app/build/outputs/apk/debug/debug-*.apk" | Select-Object -First 1
              if ($apkFile) {
                  Write-Host "Publishing Release to GitHub.com..." -ForegroundColor Green
                  gh release create $tagName $apkFile.FullName --title "Hello Reader $tagName" --generate-notes --prerelease
              }
          }
        shell: powershell

      - name: Auto Publish to Gitea Releases (No Tag Required)
        uses: https://gitea.com/actions/gitea-release-action@v1
        continue-on-error: true
        with:
          files: app/build/outputs/apk/debug/debug-*.apk
          name: Hello Reader Latest Alpha Build
          tag_name: latest-alpha
          draft: false
          prerelease: true
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

