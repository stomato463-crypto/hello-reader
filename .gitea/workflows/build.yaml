name: Hello Reader CI Build & Release

on:
  push:
    branches:
      - main
      - master
      - alpha
      - 'dev-*'
      - '*'
  pull_request:

jobs:
  build:
    runs-on: host
    env:
      ANDROID_HOME: C:\Users\owner\AppData\Local\Android\Sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure local.properties exists
        run: |
          if (-not (Test-Path "local.properties")) {
              "sdk.dir=C:\\Users\\owner\\AppData\\Local\\Android\\Sdk" | Out-File -FilePath "local.properties" -Encoding utf8
          }
        shell: powershell

      - name: Build Debug APK (Windows Host)
        run: .\gradlew.bat assembleDebug
        shell: powershell

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Auto Publish to Gitea Releases (No Tag Required)
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Hello Reader Latest Alpha Build
          tag_name: latest-alpha
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
